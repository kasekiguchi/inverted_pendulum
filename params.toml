# Plant / controller parameters. SI units unless noted.
# State x = [th, psi, dth, dpsi]: body tilt (+ forward), wheel angle relative to
# the body, and their rates. Control u = -K x [rad/s] (wheel speed command).

[plant]
g = 9.81
wheel_radius = 0.029   # m  (Tamiya 58 mm tire)
m_body = 0.35          # kg, everything except the wheels (FIRE, rollers, frame)
l = 0.03               # m, CoG height above the axle
J_body = 3e-4          # kg m^2, pitch inertia about the CoG (rough estimate)
# Upside-down swing test (`pend fit-swing`): wn^2 = m g l / J_axle.
# If > 0 it overrides J_body.
swing_wn = 0.0         # rad/s
m_wheels = 0.05        # kg, both wheels incl. tires and rotors
# Roller485 speed loop modelled as first order: psi'' = (u - psi') / motor_tau.
# Identified with `pend fit-step` (wheels in the air).
motor_tau = 0.033       # s
# Measured speed loop (`pend fit-step --update`): second order with a zero and
# dead time. Used to verify / optimise the gains. motor_wn = 0 disables it.
motor_k = 0.8579
motor_wn = 7.469         # rad/s
motor_zeta = 2.109
motor_tz = 0.5424         # s
motor_delay = 0        # samples

[control]
dt = 0.01              # s, must match kDtUs in firmware/src/main.cpp
tf = 0.02              # s, derivative filter time constant (firmware TF)
u_max = 30.0           # rad/s

[lqr]
q = [100.0, 0.1, 1.0, 0.01]   # weights for [th, psi, dth, dpsi]
r = 0.01

[sim]
th0_deg = 3.0
theta_bias_deg = 0.5   # tilt measurement error (trim) used in the simulation
t_end = 8.0
enc_res_deg = 0.01
