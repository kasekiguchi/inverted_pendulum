[project]
name = "pendulum"
version = "0.1.0"
description = "Design and tuning tools for a Roller485 two-wheeled inverted pendulum"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyserial>=3.5",
]

[project.scripts]
pend = "pendulum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pendulum"]
